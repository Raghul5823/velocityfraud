[project]
name = "velocityfraud"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.14.2",
    "fastavro>=1.12.2",
    "loguru>=0.7.3",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    # ---- Layer 2: Model Training ----
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "mlflow-skinny>=2.18.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "pyarrow>=17.0.0",
    "joblib>=1.4.0",
    # ---- Layer 4: SHAP + Gemini (optional) ----
    "shap>=0.46.0",
    # Pin numba + llvmlite to Python 3.11-compatible versions
    # (shap -> numba -> llvmlite chain otherwise resolves to a 2020 version).
    "numba>=0.60.0",
    "llvmlite>=0.43.0",
    "google-generativeai>=0.8.0",
    # ---- Layer 6: PostgreSQL sink ----
    "psycopg[binary]>=3.2.0",
    # ---- Layer 5: DistilBERT text anomaly ----
    "transformers>=4.44.0",
    # Torch pinned via CPU-only wheel to avoid the 750MB CUDA download.
    # See [tool.uv.sources] below for the index override.
    "torch>=2.0.0",
    # ---- Layer 8: Redis blocklist ----
    "redis>=5.0.0",
    # ---- Layer 5b: Groq LLM scoring (free-tier only) ----
    "groq>=0.11.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.hatch.build.targets.wheel]
packages = ["src/velocityfraud"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = true
