name: CI — pytest

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-caching: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pytest with coverage
        run: uv run pytest tests/ -v --cov=src/velocityfraud --cov-report=term-missing

  # Closes proposal gap (docs/proposal_gap_remediation.md): Section 10.1's
  # "every PR runs a small synthetic load benchmark; a regression below the
  # agreed p95 budget fails the build" -- this never existed before. The real
  # trained champion model is git-ignored by design, so a fresh checkout has
  # no model to serve; scripts/make_ci_stub_model.py fabricates a tiny,
  # schema-compatible, throwaway model (random synthetic training data) so
  # this measures genuine HTTP + FastAPI + XGBoost SERVING latency -- the
  # thing that actually regresses if someone adds accidental overhead to
  # /score -- not model accuracy, which this stub cannot and does not test.
  #
  # Reuses perf/k6-score.js (the same script behind the certified Wk15
  # 301,535-request cloud throughput run) rather than a separate CI-only
  # script, so the SLO thresholds enforced here (p95<100ms, p99<200ms) are
  # the identical, already-proven ones -- just run for 20s instead of 30min.
  #
  # Known caveat, recorded rather than hidden: GitHub-hosted runners are
  # shared, variable-performance infrastructure. The threshold was met with
  # large margin locally (p95=55ms) and on a dedicated cloud VM (p95=56.69ms)
  # against a heavier real model, so a lighter 5-tree stub model should stay
  # comfortably under budget -- but an occasional flaky failure from noisy-
  # neighbor CPU contention, unrelated to a real code regression, is an
  # accepted trade-off of using free shared CI infrastructure for a latency
  # gate at all.
  latency-gate:
    runs-on: ubuntu-latest
    needs: test

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-caching: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --dev

      - name: Generate throwaway CI stub model (latency shape only, not accuracy)
        run: uv run python scripts/make_ci_stub_model.py

      - name: Install k6
        run: |
          curl -s https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Start scoring API
        run: |
          export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
          nohup uv run uvicorn velocityfraud.api:app --host 0.0.0.0 --port 8000 --workers 2 > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then echo "API ready"; break; fi
            sleep 1
          done
          curl -sf http://localhost:8000/health || (cat api.log && exit 1)

      - name: Run k6 latency gate (20s, same thresholds as the certified Wk15 run)
        run: k6 run -e BASE_URL=http://localhost:8000 -e RATE_PER_SEC=20 -e DURATION=20s perf/k6-score.js

      - name: Show API logs on failure
        if: failure()
        run: cat api.log || true
